<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="build" content="__BUILD__">
<base href="/">
<title>Kanban · terminum</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shapes.css">
<link rel="stylesheet" href="planpane.css">
<link rel="stylesheet" href="tmux.css">
<link rel="stylesheet" href="projects.css">
<link rel="stylesheet" href="kanban.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="markdown.css">
<link rel="stylesheet" href="sheets.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="grain.css">
<style id="customcss"></style>
</head>
<body class="board-page">
<header id="boardhead" class="wavebar">
  <nav class="seg" aria-label="Pages">
    <a id="tosessions" href="/sessions/">Sessions</a>
    <a href="/kanban/" aria-current="page">Kanban</a>
  </nav>
  <div id="filters">
    <details id="fproject" class="pick" name="picks"><summary class="textkey" title="The project the board shows">All projects</summary><div class="box menurows" role="group" aria-label="Projects"></div></details>
    <label class="search field"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:15px"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input id="find" type="search" placeholder="Find tasks" aria-label="Find tasks" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <button id="filtersbtn" class="textkey" type="button" aria-expanded="false" aria-controls="picks">Filters</button>
    <div id="picks">
      <details id="fseverity" class="pick" name="picks"><summary class="textkey">Severity</summary><div class="box menurows" role="group" aria-label="Severity"></div></details>
      <details id="fowner" class="pick" name="picks"><summary class="textkey">Owner</summary><div class="box menurows" role="group" aria-label="Owner"></div></details>
      <button id="clearfilters" class="textkey" type="button" hidden>Clear filters</button>
    </div>
  </div>
  <div id="boardacts"><button id="newtask" class="textkey primary" type="button">New task</button></div>
</header>
<div id="boardbanner" class="banner" role="status" hidden></div>
<div id="asks" aria-live="polite" hidden></div>
<div id="colswitch" class="seg" role="tablist" aria-label="Columns"></div>
<main id="board" aria-label="Tasks"></main>
<p id="toast" class="box" role="status" popover="manual" hidden></p>

<dialog id="taskbox" class="box dlg" aria-labelledby="tasktitle">
  <form method="dialog" id="taskform">
    <div class="dhead"><h2 id="tasktitle"></h2><button id="taskclose" class="icon x" type="button" title="Close (Esc)" aria-label="Close"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div id="taskbody"></div>
  </form>
</dialog>

<dialog id="newbox" class="box dlg" aria-labelledby="newhead">
  <form method="dialog" id="newform">
    <div class="dhead"><h2 id="newhead">New task</h2><button id="newclose" class="icon x" type="button" title="Close (Esc)" aria-label="Close"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <label class="fieldrow">Title <input id="newtitle" class="field" type="text" maxlength="200" autocomplete="off"></label>
    <div class="edithead"><span>Text</span>
      <div class="seg" role="tablist" aria-label="Text view">
        <button id="newwrite" type="button" role="tab" aria-selected="true">Write</button>
        <button id="newpreview" type="button" role="tab" aria-selected="false">Preview</button>
      </div>
    </div>
    <textarea id="newtext" class="field" rows="9" aria-label="Text, Markdown" placeholder="Markdown. Drop or paste files here."></textarea>
    <div id="newshown" class="markdown" hidden></div>
    <ul id="newfiles" class="filelist"></ul>
    <div class="fieldgrid">
      <label class="fieldrow">Project <select id="newproj" class="field"></select></label>
      <label class="fieldrow">Severity <select id="newsev" class="field"><option>P0</option><option>P1</option><option selected>P2</option><option>P3</option></select></label>
      <label class="fieldrow">Owner <select id="newowner" class="field"></select></label>
      <label class="fieldrow">Session <select id="newsession" class="field"></select></label>
    </div>
    <input id="newpick" type="file" multiple hidden>
    <p id="newerror" role="alert" hidden></p>
    <div class="actions">
      <button id="newadd" type="button">Add files…</button>
      <button id="newdiscard" type="button">Discard</button>
      <button id="newcreate" type="button" class="primary">Create</button>
    </div>
  </form>
</dialog>

<dialog id="movebox" class="box dlg menurows" aria-label="Move to"><form method="dialog" id="moverows" tabindex="-1"></form></dialog>

<dialog id="agentbox" class="box dlg" aria-labelledby="agenthead">
  <form method="dialog" id="agentform">
    <div class="dhead"><h2 id="agenthead">Add agent</h2><button class="icon x" type="button" title="Close (Esc)" aria-label="Close"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="fieldgrid">
      <label class="fieldrow">Project <select id="agentproject" class="field"></select></label>
      <label class="fieldrow">Name <input id="agentname" class="field" type="text" autocomplete="off" spellcheck="false"></label>
      <label class="fieldrow">Kind <select id="agentkind" class="field"><option value="claude">Claude Code</option><option value="codex">Codex</option></select></label>
      <label class="fieldrow">Server <select id="agenthost" class="field"></select></label>
    </div>
    <label class="fieldrow">Folder <input id="agentdir" class="field" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fieldrow">Command <input id="agentcommand" class="field" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p id="agenterror" role="alert" hidden></p>
    <div class="actions">
      <button id="agentdrop" type="button" hidden>Delete</button>
      <button value="cancel" type="submit" formnovalidate>Cancel</button>
      <button id="agentok" type="button" class="primary">Add</button>
    </div>
  </form>
</dialog>

<dialog id="runbox" class="box dlg" aria-labelledby="runhead">
  <form method="dialog" id="runform">
    <div class="dhead"><h2 id="runhead">Run</h2><button class="icon x" type="button" title="Close (Esc)" aria-label="Close"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <p id="runnone" hidden></p>
    <div id="runfields" class="fieldgrid">
      <label class="fieldrow">Agent <select id="runagent" class="field"></select></label>
      <label class="fieldrow">Folder <input id="runfolder" class="field" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    </div>
    <dl id="runfacts" class="runfacts"><dt>Server</dt><dd id="runserver"></dd><dt>Command</dt><dd id="runcommand"></dd></dl>
    <p id="runmarked" class="runmarked" hidden>An agent wrote this text.</p>
    <pre id="runprompt" class="runprompt" tabindex="0" aria-label="What will be sent"></pre>
    <p id="runerror" role="alert" hidden></p>
    <div class="actions">
      <button id="runadd" type="button" hidden>Add agent</button>
      <button id="runjust" type="button" hidden>Only move it</button>
      <button id="runfresh" type="button" hidden>Run from scratch</button>
      <button value="cancel" type="submit" formnovalidate>Cancel</button>
      <button id="rungo" type="button" class="primary">Run</button>
    </div>
  </form>
</dialog>

<dialog id="limitsbox" class="box dlg" aria-labelledby="limitshead">
  <form method="dialog">
    <div class="dhead"><h2 id="limitshead">Memory limits</h2><button class="icon x" type="button" title="Close (Esc)" aria-label="Close"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <p id="limitstext"></p>
    <div class="fieldgrid">
      <label class="fieldrow">Warn the agent, GiB <input id="limitwarn" class="field" type="number" min="0" step="0.5"></label>
      <label class="fieldrow">End the session, GiB <input id="limitend" class="field" type="number" min="0" step="0.5"></label>
    </div>
    <p id="limitserror" role="alert" hidden></p>
    <div class="actions">
      <button id="limitsglobal" type="button">Use the global ones</button>
      <button value="cancel" type="submit" formnovalidate>Cancel</button>
      <button id="limitsok" type="button" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="confirmbox" class="box dlg" aria-labelledby="confirmtitle">
  <form method="dialog">
    <div class="dhead"><h2 id="confirmtitle"></h2><button class="icon x" type="button" title="Close (Esc)" aria-label="Close"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <p id="confirmtext"></p>
    <div class="actions" id="confirmacts">
      <button value="cancel" type="submit">Cancel</button>
      <button id="confirmok" value="ok" type="submit" class="primary">OK</button>
    </div>
  </form>
</dialog>

<dialog id="namebox" class="box dlg" aria-labelledby="nametext">
  <form method="dialog">
    <div class="dhead"><h2 id="nametext"></h2><button class="icon x" type="button" title="Close (Esc)" aria-label="Close"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:16px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <input id="namefield" class="field" type="text" aria-labelledby="nametext" maxlength="40" autocomplete="off" spellcheck="false">
    <p id="nameerror" role="alert" hidden></p>
    <div class="actions">
      <button value="cancel" type="submit" formnovalidate>Cancel</button>
      <button id="nameok" value="ok" type="submit" class="primary">Create</button>
    </div>
  </form>
</dialog>
<script type="module" src="grain.js"></script>
<script type="module" src="kanban.js"></script>
</body>
</html>
